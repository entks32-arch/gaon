<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시공 게시판 시스템</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 로그인 화면 -->
    <div id="loginScreen" class="screen active">
        <div class="login-container">
            <img src="logo.png" alt="가온 로고" class="login-logo">
            <h1>가온디앤아이<br class="mobile-br">견적/시공</h1>
            <div class="login-box">
                <h2>로그인</h2>
                <input type="password" id="loginPassword" placeholder="비밀번호 입력" />
                <button id="loginButton">로그인</button>
            </div>
        </div>
    </div>

    <!-- 게시판 선택 화면 -->
    <div id="boardSelectionScreen" class="screen">
        <div class="selection-container">
            <img src="logo.png" alt="가온 로고" class="selection-logo">
            <h1>가온디앤아이 견적/시공</h1>
            <p class="selection-subtitle" id="selectionUserType"></p>
            
            <div class="board-selection">
                <div class="board-card" id="selectConstructionBoard">
                    <div class="board-icon">🏗️</div>
                    <h2>시공 게시판</h2>
                    <p>견적 및 시공 사례 관리</p>
                </div>
                
                <div class="board-card" id="selectMaterialBoard">
                    <div class="board-icon">📦</div>
                    <h2>자재 게시판</h2>
                    <p>자재 정보 및 가격 관리</p>
                </div>
            </div>
            
            <button class="btn-logout" id="selectionLogoutButton">로그아웃</button>
        </div>
    </div>

    <!-- 관리자 화면 -->
    <div id="adminScreen" class="screen">
        <div class="header">
            <div class="header-logo-title">
                <img src="logo.png" alt="가온 로고" class="header-logo">
                <h1>게시판 관리 - 관리자</h1>
            </div>
            <div class="header-actions">
                <span class="user-info">👔 관리자</span>
                <button class="btn-logout" id="adminLogoutButton">로그아웃</button>
            </div>
        </div>

        <!-- 탭 메뉴 -->
        <div class="tab-menu">
            <button class="tab-button active" id="adminConstructionTab">🏗️ 시공 게시판</button>
            <button class="tab-button" id="adminMaterialTab">📦 자재 게시판</button>
        </div>

        <!-- 시공 게시판 컨텐츠 -->
        <div id="adminConstructionContent" class="tab-content active">

        <div class="container">
            <div class="action-buttons">
                <button id="showAddPostButton" class="btn-primary">➕ 게시글 등록</button>
                <button id="clearAllDataButton" class="btn-warning">🗑️ 전체 데이터 초기화</button>
            </div>
            
            <!-- 저장 공간 정보 -->
            <div id="storageInfo" class="storage-info">
                <div>
                    <strong>💾 저장 공간:</strong> IndexedDB로 대용량 저장 가능!
                </div>
            </div>

            <!-- 게시글 등록 폼 -->
            <div id="addPostForm" class="post-form" style="display: none;">
                <h3>게시글 등록</h3>
                <div class="form-group">
                    <label>시공 내용</label>
                    <textarea id="adminContent" rows="4" placeholder="시공 내용을 입력하세요"></textarea>
                </div>
                <div class="form-group">
                    <label>견적</label>
                    <input type="text" id="adminEstimate" placeholder="예: 5,000,000원" />
                </div>
                <div class="form-group">
                    <label>실측 여부</label>
                    <select id="adminSurvey">
                        <option value="했음">했음</option>
                        <option value="안했음">안했음</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>이미지 첨부 (최대 5개, 자동 압축됨)</label>
                    <input type="file" id="adminImage" accept="image/*" multiple />
                    <small class="form-hint">💡 이미지는 자동으로 압축되어 저장됩니다</small>
                </div>
                <div class="form-actions">
                    <button id="addPostButton" class="btn-primary">등록</button>
                    <button id="hideAddPostButton" class="btn-secondary">취소</button>
                </div>
            </div>

            <!-- 검색 -->
            <div class="search-box">
                <input type="text" id="adminSearchInput" placeholder="🔍 키워드 검색..." />
            </div>

            <!-- 게시글 목록 -->
            <div id="adminPostList" class="post-list"></div>
        </div>
        </div>

        <!-- 자재 게시판 컨텐츠 -->
        <div id="adminMaterialContent" class="tab-content">
        <div class="container">
            <div class="action-buttons">
                <button id="showAddMaterialButton" class="btn-primary">➕ 자재 등록</button>
                <button id="clearAllMaterialButton" class="btn-warning">🗑️ 전체 자재 초기화</button>
            </div>

            <!-- 자재 등록 폼 -->
            <div id="addMaterialForm" class="post-form" style="display: none;">
                <h3>자재 등록</h3>
                <div class="form-group">
                    <label>자재명</label>
                    <input type="text" id="adminMaterialName" placeholder="예: 타일, 벽지, 페인트 등" />
                </div>
                <div class="form-group">
                    <label>자재 설명</label>
                    <textarea id="adminMaterialDesc" rows="4" placeholder="자재에 대한 상세 설명을 입력하세요"></textarea>
                </div>
                <div class="form-group">
                    <label>금액</label>
                    <input type="text" id="adminMaterialPrice" placeholder="예: 50,000원" />
                </div>
                <div class="form-group">
                    <label>이미지 첨부 (최대 5개, 자동 압축됨)</label>
                    <input type="file" id="adminMaterialImage" accept="image/*" multiple />
                    <small class="form-hint">💡 이미지는 자동으로 압축되어 저장됩니다</small>
                </div>
                <div class="form-actions">
                    <button id="addMaterialButton" class="btn-primary">등록</button>
                    <button id="hideMaterialButton" class="btn-secondary">취소</button>
                </div>
            </div>

            <!-- 검색 -->
            <div class="search-box">
                <input type="text" id="adminMaterialSearchInput" placeholder="🔍 자재명, 설명, 금액으로 검색..." />
            </div>

            <!-- 자재 목록 -->
            <div id="adminMaterialList" class="post-list"></div>
        </div>
        </div>
    </div>

    <!-- 사용자 화면 -->
    <div id="userScreen" class="screen">
        <div class="header">
            <div class="header-logo-title">
                <img src="logo.png" alt="가온 로고" class="header-logo">
                <h1>게시판</h1>
            </div>
            <div class="header-actions">
                <span class="user-info">👤 사용자</span>
                <button class="btn-logout" id="userLogoutButton">로그아웃</button>
            </div>
        </div>

        <!-- 탭 메뉴 -->
        <div class="tab-menu">
            <button class="tab-button active" id="userConstructionTab">🏗️ 시공 게시판</button>
            <button class="tab-button" id="userMaterialTab">📦 자재 게시판</button>
        </div>

        <!-- 시공 게시판 컨텐츠 -->
        <div id="userConstructionContent" class="tab-content active">

        <div class="container">
            <div class="action-buttons">
                <button id="userShowAddPostButton" class="btn-primary">➕ 게시글 등록</button>
            </div>

            <!-- 게시글 등록 폼 -->
            <div id="userAddPostForm" class="post-form" style="display: none;">
                <h3>게시글 등록</h3>
                <div class="form-group">
                    <label>시공 내용</label>
                    <textarea id="userContent" rows="4" placeholder="시공 내용을 입력하세요"></textarea>
                </div>
                <div class="form-group">
                    <label>견적</label>
                    <input type="text" id="userEstimate" placeholder="예: 5,000,000원" />
                </div>
                <div class="form-group">
                    <label>실측 여부</label>
                    <select id="userSurvey">
                        <option value="했음">했음</option>
                        <option value="안했음">안했음</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>이미지 첨부 (최대 5개, 자동 압축됨)</label>
                    <input type="file" id="userImage" accept="image/*" multiple />
                    <small class="form-hint">💡 이미지는 자동으로 압축되어 저장됩니다</small>
                </div>
                <div class="form-actions">
                    <button id="userAddPostButton" class="btn-primary">등록</button>
                    <button id="userHideAddPostButton" class="btn-secondary">취소</button>
                </div>
            </div>

            <!-- 검색 -->
            <div class="search-box">
                <input type="text" id="userSearchInput" placeholder="🔍 키워드 검색..." />
            </div>

            <!-- 게시글 목록 -->
            <div id="userPostList" class="post-list"></div>
        </div>
        </div>

        <!-- 자재 게시판 컨텐츠 -->
        <div id="userMaterialContent" class="tab-content">
        <div class="container">
            <div class="action-buttons">
                <button id="userShowAddMaterialButton" class="btn-primary">➕ 자재 등록</button>
            </div>

            <!-- 자재 등록 폼 -->
            <div id="userAddMaterialForm" class="post-form" style="display: none;">
                <h3>자재 등록</h3>
                <div class="form-group">
                    <label>자재명</label>
                    <input type="text" id="userMaterialName" placeholder="예: 타일, 벽지, 페인트 등" />
                </div>
                <div class="form-group">
                    <label>자재 설명</label>
                    <textarea id="userMaterialDesc" rows="4" placeholder="자재에 대한 상세 설명을 입력하세요"></textarea>
                </div>
                <div class="form-group">
                    <label>금액</label>
                    <input type="text" id="userMaterialPrice" placeholder="예: 50,000원" />
                </div>
                <div class="form-group">
                    <label>이미지 첨부 (최대 5개, 자동 압축됨)</label>
                    <input type="file" id="userMaterialImage" accept="image/*" multiple />
                    <small class="form-hint">💡 이미지는 자동으로 압축되어 저장됩니다</small>
                </div>
                <div class="form-actions">
                    <button id="userAddMaterialButton" class="btn-primary">등록</button>
                    <button id="userHideMaterialButton" class="btn-secondary">취소</button>
                </div>
            </div>

            <!-- 검색 -->
            <div class="search-box">
                <input type="text" id="userMaterialSearchInput" placeholder="🔍 자재명, 설명, 금액으로 검색..." />
            </div>

            <!-- 자재 목록 -->
            <div id="userMaterialList" class="post-list"></div>
        </div>
        </div>
    </div>

    <!-- 게시글 상세보기 모달 -->
    <div id="postModal" class="modal">
        <div class="modal-content">
            <span class="close" id="modalCloseButton">&times;</span>
            <div id="modalPostContent"></div>
        </div>
    </div>

    <script type="module" src="db.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="materials.js"></script>
</body>
</html>
