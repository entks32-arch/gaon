<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시공 게시판 시스템</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 로그인 화면 -->
    <div id="loginScreen" class="screen active">
        <div class="login-container">
            <h1>🏗️ 시공 게시판</h1>
            <div class="login-box">
                <h2>로그인</h2>
                <input type="password" id="loginPassword" placeholder="비밀번호 입력" />
                <button onclick="login()">로그인</button>
                <div class="login-hint">
                    <p>👤 사용자: 1478</p>
                    <p>👔 관리자: 8810</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 관리자 화면 -->
    <div id="adminScreen" class="screen">
        <div class="header">
            <h1>📋 시공 게시판 - 관리자</h1>
            <div class="header-actions">
                <span class="user-info">👔 관리자</span>
                <button onclick="logout()" class="btn-logout">로그아웃</button>
            </div>
        </div>

        <div class="container">
            <div class="action-buttons">
                <button onclick="showAddPostForm()" class="btn-primary">➕ 게시글 등록</button>
                <button onclick="clearAllData()" class="btn-warning">🗑️ 전체 데이터 초기화</button>
            </div>
            
            <!-- 저장 공간 정보 -->
            <div id="storageInfo" class="storage-info">
                <div>
                    <strong>💾 저장 공간:</strong> IndexedDB로 대용량 저장 가능!
                </div>
            </div>

            <!-- 게시글 등록 폼 -->
            <div id="addPostForm" class="post-form" style="display: none;">
                <h3>게시글 등록</h3>
                <div class="form-group">
                    <label>시공 내용</label>
                    <textarea id="adminContent" rows="4" placeholder="시공 내용을 입력하세요"></textarea>
                </div>
                <div class="form-group">
                    <label>견적</label>
                    <input type="text" id="adminEstimate" placeholder="예: 5,000,000원" />
                </div>
                <div class="form-group">
                    <label>실측 여부</label>
                    <select id="adminSurvey">
                        <option value="했음">했음</option>
                        <option value="안했음">안했음</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>이미지 첨부 (최대 5개, 자동 압축됨)</label>
                    <input type="file" id="adminImage" accept="image/*" multiple />
                    <small class="form-hint">💡 이미지는 자동으로 압축되어 저장됩니다</small>
                </div>
                <div class="form-actions">
                    <button onclick="addPost()" class="btn-primary">등록</button>
                    <button onclick="hideAddPostForm()" class="btn-secondary">취소</button>
                </div>
            </div>

            <!-- 검색 -->
            <div class="search-box">
                <input type="text" id="adminSearchInput" placeholder="🔍 키워드 검색..." onkeyup="searchPosts('admin')" />
            </div>

            <!-- 게시글 목록 -->
            <div id="adminPostList" class="post-list"></div>
        </div>
    </div>

    <!-- 사용자 화면 -->
    <div id="userScreen" class="screen">
        <div class="header">
            <h1>📋 시공 게시판</h1>
            <div class="header-actions">
                <span class="user-info">👤 사용자</span>
                <button onclick="logout()" class="btn-logout">로그아웃</button>
            </div>
        </div>

        <div class="container">
            <!-- 검색 -->
            <div class="search-box">
                <input type="text" id="userSearchInput" placeholder="🔍 키워드 검색..." onkeyup="searchPosts('user')" />
            </div>

            <!-- 게시글 목록 -->
            <div id="userPostList" class="post-list"></div>
        </div>
    </div>

    <!-- 게시글 상세보기 모달 -->
    <div id="postModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalPostContent"></div>
        </div>
    </div>

    <script type="module" src="db.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
